claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-haiku-5-5}
  fallback-model: ${CLAUDE_FALLBACK_MODEL:}       # 429·장애일 때 넘어갈 예비 모델. 비우면 사용 안 함
  effort: ${CLAUDE_EFFORT:low}                     # low | medium | high | xhigh | max
  max-tokens: ${CLAUDE_MAX_TOKENS:4096}            # 사고 토큰 포함. 잘리면 422
  timeout: 30s                                     # 재시도·예비 모델·도구 호출 왕복까지 포함한 호출 전체 상한
  image-timeout: 30s
  max-retries: 1
  mock: ${CLAUDE_MOCK:false}
  mock-delay-ms: ${CLAUDE_MOCK_DELAY_MS:0}   # 성능 테스트용: mock 응답에 인위적 지연

ocr:
  django-url: ${OCR_DJANGO_URL:}
  timeout: 20s
  llm-fallback: true                               # Django 주소가 없으면 Claude 가 이미지를 직접 읽음

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
