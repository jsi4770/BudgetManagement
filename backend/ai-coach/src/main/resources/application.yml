claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-opus-5-5}
  fallback-model: ${CLAUDE_FALLBACK_MODEL:}   # 429·장애 때 넘어갈 예비 모델. 비우면 사용 안 함
  effort: ${CLAUDE_EFFORT:low}                # 생각 깊이 low|medium|high|xhigh|max
  timeout: 30s                                # 재시도·예비 모델·도구 왕복까지 포함한 호출 전체 상한
  image-timeout: 30s
  max-retries: 1
  mock: ${CLAUDE_MOCK:false}
  mock-delay-ms: ${CLAUDE_MOCK_DELAY_MS:0}   # 성능 테스트용: mock 응답에 인위적 지연

ocr:
  django-url: ${OCR_DJANGO_URL:}
  timeout: 20s
  gemini-fallback: true

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
