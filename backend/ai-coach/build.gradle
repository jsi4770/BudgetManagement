plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.back'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework:spring-tx'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 성능/품질 평가는 기본 테스트에서 제외 (./gradlew perf, ./gradlew eval 로 실행)
    systemProperty 'spring.profiles.active', 'test'
    exclude '**/perf/**', '**/eval/**'
}

// ./gradlew perf  → 지연·처리량 측정 (Gemini mock, 키 불필요)
// ./gradlew eval  → AI 출력 품질 평가 (오프라인 검증기 평가 + GEMINI_API_KEY 가 있으면 실제 호출 평가)
['perf', 'eval'].each { name ->
    tasks.register(name, Test) {
        group = 'verification'
        description = name == 'perf' ? '응답 지연·처리량 측정' : 'AI 출력 품질 평가'
        useJUnitPlatform()
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        filter { includeTestsMatching "com.back.was.${name}.*" }
        outputs.upToDateWhen { false }
        testLogging { showStandardStreams = true }
        systemProperty 'report.dir', "${buildDir}/perf-report"
    }
}
