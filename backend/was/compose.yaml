# 로컬 개발용 PostgreSQL + 애플리케이션.
#
#   docker compose up -d --build   # 둘 다 띄우기 (앱 코드가 바뀌면 --build)
#   docker compose up -d postgres  # DB 만 띄우기 (앱은 ./gradlew bootRun 으로)
#   docker compose down            # 내리기 (데이터는 남음)
#   docker compose down -v         # 데이터까지 지우기
#   docker compose logs -f app     # 앱 로그
#
# **개발 중에는 `up -d postgres` 로 DB 만 띄우고 앱은 `bootRun` 으로 돌리는 쪽이 편합니다**
# — 코드를 고칠 때마다 이미지를 다시 만들지 않아도 되니까요. `app` 서비스는 "컨테이너로도
# 뜬다"를 확인하거나 시연 환경을 한 번에 세울 때 씁니다.
#
# DB 값이 전부 application.properties 의 기본값과 맞춰져 있어서, `postgres` 만 띄운 뒤
# `./gradlew bootRun` 을 하면 환경 변수 없이 바로 붙습니다.
#
#   spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/budget}
#   spring.datasource.username=${DB_USERNAME:postgres}
#   spring.datasource.password=${DB_PASSWORD:postgres}
#
# 비밀번호가 평문인 것은 로컬 전용이라서입니다. 운영은 `DB_URL`·`DB_USERNAME`·
# `DB_PASSWORD` 환경 변수로 덮어쓰고, 이 파일을 쓰지 않습니다.
#
# 테스트는 이 컨테이너를 쓰지 않습니다 — 인메모리 H2(`MODE=PostgreSQL`)로 돕니다.
# 그래서 `./gradlew test` 는 Docker 가 꺼져 있어도 통과합니다.

services:
  postgres:
    # 운영에서 쓸 메이저 버전과 맞추세요. 로컬만 올려 두면 운영에 없는 문법을
    # 쓰고도 모르게 됩니다.
    image: postgres:17-alpine
    container_name: was-postgres

    environment:
      # application.properties 의 기본값 세 개와 일치해야 합니다.
      POSTGRES_DB: budget
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # ERD 0장: 서버·DB·스케줄러 모두 KST.
      #
      # 애플리케이션은 `hibernate.jdbc.time_zone=Asia/Seoul` 로 값을 변환해서 넣으므로
      # 이 설정이 저장되는 데이터를 바꾸지는 않습니다. 그래도 맞춰 두는 이유는
      # psql 로 직접 들여다볼 때입니다 — `now()` 나 timestamp 출력이 UTC 로 나오면
      # "오늘"의 경계(넛지의 주 계산, 챌린지 종료 판정)를 손으로 확인할 때 9시간씩
      # 어긋나 보입니다.
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul

    ports:
      # 로컬에 이미 PostgreSQL 이 5432 를 쓰고 있으면 여기서 충돌합니다.
      # 그때는 왼쪽만 바꾸고(예: "15432:5432") DB_URL 환경 변수로 포트를 알려주세요.
      - "5432:5432"

    volumes:
      # 데이터를 남깁니다 — DEV-01 로 깐 시연 데이터가 재기동 후에도 살아 있어야
      # 발표 직전에 다시 깔 필요가 없습니다. 깨끗하게 비우려면 `down -v`.
      - was-postgres-data:/var/lib/postgresql/data

    # `depends_on: condition: service_healthy` 로 기다릴 수 있게 해 둡니다.
    # 애플리케이션을 컨테이너로 올리게 되면 그때 쓰입니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  app:
    build:
      context: .
    container_name: was-app
    # DB 가 **헬스체크를 통과한 뒤** 시작합니다. 이게 없으면 앱이 먼저 떠서
    # "database does not exist" 로 죽습니다 — PostgreSQL 은 포트를 열고 나서도
    # 초기화(initdb)에 몇 초가 더 걸립니다.
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # 컨테이너 안에서는 localhost 가 아니라 **서비스 이름**으로 DB 를 찾습니다.
      # 이 한 줄이 bootRun 과 컨테이너 실행의 유일한 차이입니다.
      DB_URL: jdbc:postgresql://postgres:5432/budget
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      # 시연용 API(`/dev/**`)와 관리자 시드 계정이 이 프로필에서만 등록됩니다.
      # 로컬·시연 환경을 전제로 기본값을 dev 로 두었습니다. 호스트에서
      # `SPRING_PROFILES_ACTIVE=prod docker compose up` 으로 덮어쓸 수 있습니다.
      #
      # ⚠️ 운영에서는 dev 로 띄우지 마세요 — 누구나 자기 데이터를 날릴 수 있고
      # (DEV-01) 비밀번호가 문서에 적힌 관리자 계정이 생깁니다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # 아래 둘은 **값 없이 키만** 적었습니다. 이렇게 두면 호스트에 그 변수가 있을 때만
      # 컨테이너로 전달되고, 없으면 아예 설정되지 않아 application.properties 의 기본값이
      # 살아납니다.
      #
      # `${JWT_SECRET:-}` 처럼 빈 기본값을 주면 **빈 문자열이 전달돼** properties 의
      # 기본값을 덮어쓰고, HS256 키 길이 검사에 걸려 부팅이 실패합니다(0바이트).
      # 실제로 그렇게 한 번 깨졌습니다.
      #
      # ⚠️ **운영에서는 JWT_SECRET 을 반드시 넘기세요.** 넘기지 않으면 커밋된 개발용
      # 기본값이 쓰이고, 그 값을 아는 사람은 아무 사용자·권한의 토큰을 위조할 수 있습니다.
      # HS256 이라 UTF-8 32바이트 이상이어야 합니다.
      JWT_SECRET:

      # 프론트 주소. 없으면 properties 의 기본값(Vite 개발 서버)이 쓰입니다.
      APP_CORS_ALLOWED_ORIGINS:

      # AI 기능(TX-07 한 줄 입력 · RCPT-01 영수증). JWT_SECRET 과 같은 이유로 **값 없이 키만**
      # 적었습니다 — 호스트에 있을 때만 전달되고, 없으면 properties 의 기본값이 쓰입니다.
      #
      # GEMINI_API_KEY 가 없어도 앱은 뜹니다. AI 기능만 503 AI_UNAVAILABLE 이고, 프론트는
      # 그 코드를 받으면 직접 입력 화면으로 안내합니다. 키를 코드·저장소에 두지 마세요.
      GEMINI_API_KEY:
      # Django OCR 서버(backend/ocr) 주소. 없으면 Gemini 가 영수증 이미지를 직접 읽습니다.
      # 컨테이너 안에서 호스트의 서버를 가리키려면 http://host.docker.internal:8000
      OCR_BASE_URL:

    ports:
      # 명세 0장 1) Base URL — http://localhost:8080/api/v1
      - "8080:8080"

    restart: unless-stopped

volumes:
  was-postgres-data:

# 스키마와 시드에 대하여
#
# 초기화 SQL 을 붙이지 않았습니다. 지금은 마이그레이션 도구가 없어서
# `spring.jpa.hibernate.ddl-auto=update` 가 스키마를 만들고, 카테고리 9개는
# `CategorySeeder` 가 넣습니다. 그래서 빈 컨테이너에 그냥 붙으면 됩니다.
#
# Flyway/Liquibase 를 도입하면 스키마와 시드가 스크립트로 옮겨가고, `ddl-auto` 는
# `validate` 로 바뀝니다 (`docs/남은_작업_계획.md` 3장). 그때도 이 파일은 그대로
# 쓰면 됩니다 — 마이그레이션은 애플리케이션이 실행하니까요.
