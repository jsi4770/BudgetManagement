# 주의: 테스트 리소스의 application.properties 는 main 쪽 파일을 '병합'하지 않고
# 클래스패스에서 가려버린다(먼저 발견된 하나만 로드됨). 그래서 main 에 있는 설정 중
# 테스트에도 필요한 값은 여기 다시 적어야 한다.
spring.application.name=was
server.servlet.context-path=/api/v1

app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=test-only-secret-key-at-least-32-bytes-long
app.jwt.access-token-validity-seconds=21600
app.jwt.refresh-token-validity-seconds=2592000

# 인메모리 H2. PostgreSQL 모드로 띄워 운영 DB와 문법 차이를 줄인다.
spring.datasource.url=jdbc:h2:mem:was;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
