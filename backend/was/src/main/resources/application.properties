spring.application.name=was

# API 명세서 0장 1) Base URL: https://{host}/api/v1
# 명세의 refresh_token 쿠키 Path=/api/v1/auth 가 성립하려면 실제 경로에 접두사가 있어야 한다.
server.servlet.context-path=/api/v1

# 명세 0장 1): Allow-Origin 에 `*` 불가 — 프론트 도메인만 나열한다.
# 운영 배포 시 실제 도메인으로 교체 (예: https://nudge.example.com)
app.cors.allowed-origins=http://localhost:5173

# JWT. 운영에서는 JWT_SECRET 환경변수로 반드시 덮어쓴다 — 아래 기본값은 개발 전용이며
# 이 값이 노출되면 누구나 임의 사용자의 토큰을 위조할 수 있다.
# HS256 이므로 UTF-8 32바이트(256비트) 이상이어야 하고, 짧으면 부팅 시 실패한다.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-replace-me-32bytes+}
# 명세 AUTH-02: accessTokenExpiresIn 21600(6시간), refresh_token 쿠키 Max-Age 2592000(30일)
app.jwt.access-token-validity-seconds=21600
app.jwt.refresh-token-validity-seconds=2592000

# DB. 로컬 기본값은 localhost PostgreSQL 이며 환경변수로 덮어쓴다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/budget}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# 마이그레이션 도구(Flyway/Liquibase)가 없는 동안의 임시 수단이다.
# 운영 전에 반드시 마이그레이션으로 옮기고 validate 로 바꿔야 한다.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
# ERD 0장: 서버·DB·스케줄러 모두 KST
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 명세 RCPT-01: 영수증 이미지 최대 10MB. Boot 기본값은 1MB 라서 명시하지 않으면
# 2MB 영수증도 413 이 된다. 초과분은 MaxUploadSizeExceededException → 413 FILE_TOO_LARGE.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- AI (Gemini) -----------------------------------------------------------------------------
# 키는 코드·저장소에 두지 않고 환경변수로만 받는다 (서버_내부_처리 8장). 키가 없어도 서버는 뜨고,
# AI 기능(TX-07·RCPT-01)만 503 AI_UNAVAILABLE 로 응답한다 — 프론트는 직접 입력 화면으로 안내한다.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# 기본 모델이 429(한도)·장애일 때 넘어갈 예비 모델. 비우면 사용 안 함
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-2.5-flash}
# true 면 실제 호출 없이 가짜 응답 — 키 없는 팀원의 로컬 실행·CI 용
gemini.mock=${GEMINI_MOCK:false}
# 호출당 읽기 타임아웃. 텍스트(TX-07·넛지·코칭)는 10초, 이미지(영수증 직접 읽기)는 30초
gemini.timeout=${GEMINI_TIMEOUT:10s}
gemini.image-timeout=${GEMINI_IMAGE_TIMEOUT:30s}
# 5xx·타임아웃 재시도 횟수 (429 는 재시도 없이 바로 예비 모델). 사용자 대기를 줄이려면 0
gemini.max-retries=${GEMINI_MAX_RETRIES:1}

# --- 영수증 OCR (RCPT-01) --------------------------------------------------------------------
# Django OCR 서버(backend/ocr) 주소. 비워 두면 서버 없이 Gemini 가 이미지를 직접 읽는다.
# 예: OCR_BASE_URL=http://localhost:8000
ocr.base-url=${OCR_BASE_URL:}
ocr.timeout=${OCR_TIMEOUT:20s}
